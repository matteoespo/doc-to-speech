name: Feature Request
description: Suggest an idea for Document Audio Reader
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
  - type: textarea
    id: idea
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to achieve.
    validations:
      required: true
  - type: textarea
    id: elevenlabs_specific
    attributes:
      label: ElevenLabs specific integration
      description: Does this idea involve ElevenLabs features (e.g. voice cloning, multiple voices)?
    validations:
      required: false
